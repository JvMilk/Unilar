{% load static %}
        <header>
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <a class="navbar-brand" href="/inicio/">
                        <img src="{% static 'imagens/logo.png' %}" alt="{{ configuracao_site.nome_site|default:'UniLar' }} — início" class="logo">
                    </a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false"
                        aria-label="Abrir menu">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="menuPrincipal">
                        <ul class="navbar-nav mx-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="/inicio/">Início</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'imoveis' %}">Imóveis</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="/sobre/">Sobre</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="/suporte/">Dúvidas</a>
                            </li>
                        </ul>

                        <div class="acoes-menu">
                            {% if user.is_staff %}
                            <a href="{% url 'admin_dashboard' %}" class="btn botao-menu"><i class="bi bi-speedometer2" aria-hidden="true"></i> Administração</a>
                            {% endif %}
                            <a href="/favoritos/" class="favoritos" aria-label="Meus favoritos">
                                <i class="bi bi-heart" aria-hidden="true"></i>
                            </a>

                            {% if user.is_authenticated %}
                            <a href="{% url 'painel' %}" class="btn botao-menu"><i class="bi bi-person-workspace" aria-hidden="true"></i> Meu painel</a>
                            {% else %}
                            <a href="{% url 'login' %}" class="btn botao-menu"{% if request.resolver_match.url_name == "login" %} aria-current="page"{% endif %}>
                                Entrar
                            </a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </nav>
        </header>
