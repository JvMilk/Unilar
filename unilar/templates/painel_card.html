{% load static %}
<article class="painel-imovel">
  <a href="{% if imovel.slug == 'kitnet-no-centro' %}{% url 'detalhe_imovel' %}{% else %}{% url 'imoveis' %}?q={{ imovel.titulo|urlencode }}{% endif %}">
    <img src="{% static imovel.imagem %}" alt="{{ imovel.titulo }}" loading="lazy">
    <div><h3>{{ imovel.titulo }}</h3><p>R$ {{ imovel.preco }}/mês</p></div>
  </a>
</article>
