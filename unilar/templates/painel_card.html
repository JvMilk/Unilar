{% load static %}
<article class="painel-imovel">
  <a href="{% url 'imovel_publico' imovel.slug %}">
    {% if imovel.imagem_url %}<img src="{{ imovel.imagem_url }}" alt="{{ imovel.titulo }}" loading="lazy">{% else %}<img src="{% static imovel.imagem %}" alt="{{ imovel.titulo }}" loading="lazy">{% endif %}
    <div><h3>{{ imovel.titulo }}</h3><p>R$ {{ imovel.preco }}/mês</p></div>
  </a>
</article>
