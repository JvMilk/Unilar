<div class="anunciar-campo{% if largo %} anunciar-campo-largo{% endif %}{% if campo.errors %} com-erro{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <b aria-hidden="true">*</b>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<small id="{{ campo.id_for_label }}_helptext">{{ campo.help_text }}</small>{% endif %}
  {% for erro in campo.errors %}<small class="anunciar-erro">{{ erro }}</small>{% endfor %}
</div>
